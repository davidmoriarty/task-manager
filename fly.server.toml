app = "server-aged-dew-6516"
primary_region = "yyz"

[build]
dockerfile = "server/Dockerfile"

[processes]
app = "sh -lc 'cd /app/server && bun dist/start.js'"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]
