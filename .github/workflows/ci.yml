name: CI

on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]

jobs:
  build:
    name: Build and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run type-check

      - name: Build
        run: bun run build
